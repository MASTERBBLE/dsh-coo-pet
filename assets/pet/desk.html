<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Coo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font: 13px/1.6 system-ui, 'Microsoft YaHei', sans-serif;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        transform-origin: 0 0;
        will-change: transform;
      }
      #stage svg.kit {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      #bubble {
        position: fixed;
        max-width: 260px;
        padding: 7px 11px;
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.95);
        color: #1d2333;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
        opacity: 0;
        transform: translate(-50%, -100%) translateY(-6px);
        transition: opacity 0.16s ease;
        pointer-events: none;
        white-space: pre-wrap;
      }
      #bubble.on {
        opacity: 1;
      }
      #bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -6px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        background: rgba(255, 255, 255, 0.95);
        transform: rotate(45deg);
      }
      .menu {
        position: fixed;
        min-width: 150px;
        padding: 5px;
        border-radius: 10px;
        background: rgba(28, 32, 44, 0.96);
        color: #eef2ff;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        font-size: 13px;
        z-index: 30;
      }
      .menu-item {
        padding: 6px 10px;
        border-radius: 7px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 13px;
      }
      .menu-item:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .menu-row {
        display: flex;
        align-items: center;
      }
      .menu-row .menu-item {
        flex: 1;
      }
      .menu-del {
        border: 0;
        background: transparent;
        color: #8b93a7;
        font-size: 13px;
        line-height: 1;
        padding: 4px 7px;
        border-radius: 6px;
        cursor: pointer;
      }
      .menu-del:hover {
        background: rgba(255, 90, 90, 0.22);
        color: #ff9d9d;
      }
      .menu-head {
        padding: 4px 10px 6px;
        font-size: 12px;
        opacity: 0.6;
      }
      #chat {
        position: fixed;
        width: 268px;
        padding: 8px;
        border-radius: 12px;
        background: rgba(28, 32, 44, 0.97);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
        z-index: 40;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #chat input {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        outline: none;
        font-size: 12px;
      }
      #chat button {
        padding: 6px 9px;
        border: 0;
        border-radius: 8px;
        background: #4d6bfe;
        color: #fff;
        cursor: pointer;
        font-size: 12px;
      }
      #chat button.ghost {
        background: rgba(255, 255, 255, 0.12);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bubble"></div>
    <div id="chat" class="hidden">
      <input id="chat-text" placeholder="跟她说一句…" />
      <button id="chat-send">发</button>
      <button id="chat-close" class="ghost">×</button>
    </div>
    <script type="module">
      const desk = window.cooDesk || { hit() {}, close() {} }
      const report = (status, payload) => {
        try {
          fetch('/dsh-coo-pet/report', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ status, ...(payload || {}) }),
          }).catch(() => {})
        } catch {
          /* 无所谓 */
        }
      }
      window.addEventListener('error', (event) => report('desk-error', { message: String(event.message || event.error) }))
      window.addEventListener('unhandledrejection', (event) =>
        report('desk-error', { message: String((event.reason && event.reason.message) || event.reason) })
      )

      const ROOT = '/dsh-coo-pet/pet'
      const stage = document.getElementById('stage')
      // kit / pack 在建她的 try 块里才 import（块级作用域），分身（全真实例）也要用，
      // 所以用模块级变量中转（建好前是 null，分身代码先判空）
      let kit = null
      let pack = null
      // buildCloneBody(root, at)：给分身造一只完整的本体实例（模型/贴图参数在建她时
      // 才拿得到，所以这里只留个壳，boot 里赋值）。at = { x, y, facing }
      let buildCloneBody = null
      const bubbleEl = document.getElementById('bubble')
      const chatEl = document.getElementById('chat')
      const chatText = document.getElementById('chat-text')

      let bubbleTimer = 0
      let bubbleAnchor = { x: 0, y: 0 }

      // 安静模式（纯手动开关，右键菜单「安静模式」）：全静音 + 不溜达不碎碎念不搬图标不乱坐；记录存 localStorage
      let offDuty = false
      try { offDuty = localStorage.getItem('coo-offduty') === '1' } catch { /* 新环境没有记录 */ }
      // 平时的小盹儿：白天闲着也会打个盹（作息感保留），一戳/一敲键盘就醒
      let napping = false
      let napTimer = 0
      // 语音录制中（快捷键/鼠标键按着）：原地站住别动，输入框里正在填她听到的话
      let voiceHeld = false

      const say = (text) => {
        if (!text) return
        if (offDuty) return
        bubbleEl.textContent = text
        bubbleEl.classList.add('on')
        // 一开口就站住：不开新步子，正在走的路也立刻打断——
        // 但她身上有正事在办时（去开软件/搬图标/去坐下）例外，别把任务路打断
        try {
          pet?.set?.({ roam: 'off' })
          if (!launchWalk && !iconWalk && !seatWalk) pet?.stopWalk?.()
        } catch {
          /* ignore */
        }
        window.clearTimeout(bubbleTimer)
        bubbleTimer = window.setTimeout(() => {
          bubbleEl.classList.remove('on')
          // 菜单/输入框开着时它们自己管 roam，别插手
          if (!menuEl && (!chatEl || chatEl.classList.contains('hidden'))) applyRoam()
        }, 4600)
        speak(text)
      }
      /* 碎碎念专用口：受「碎碎念气泡」开关管（回答气泡、点她后的操作反馈不受它管）。
         之前开关只拦了闲坐碎碎念那一处，睡觉晚安/孤独嗔怪/坐下感慨这些自言自语照说不误——
         开关关了嘴还在动，这就是「开关和行为不匹配」的根源 */
      const chatterSay = (text) => {
        if (!text) return
        if ((prefs && prefs.idleBubble) === false) return
        say(text)
      }

      /* 朗读：用系统语音；咿呀模式就把音调拉高、语速加快，听着像小动物 */
      let voicesCache = []
      const warmVoices = () => {
        try {
          const synth = window.speechSynthesis
          if (!synth) return
          const got = synth.getVoices()
          if (got && got.length) voicesCache = got
        } catch {
          /* ignore */
        }
      }
      warmVoices()
      try {
        window.speechSynthesis?.addEventListener?.('voiceschanged', warmVoices)
      } catch {
        /* ignore */
      }
      /* 咿呀声：按字取片段现场拼 */
      const babble = {
        ready: false,
        failed: false,
        trying: false,
        attempts: 0,
        retryAt: 0,
        ctx: null,
        buffer: null,
        units: {},
        keys: [],
        pending: '',
      }
      const BABBLE_TRIES = 4
      const BABBLE_BACKOFF = 5000
      const hashChar = (ch) => {
        let n = 0
        for (let i = 0; i < ch.length; i += 1) n = (n * 31 + ch.charCodeAt(i)) % 100000
        return n
      }
      const babbleCtx = () => {
        if (!babble.ctx) {
          const C = window.AudioContext || window.webkitAudioContext
          if (!C) return null
          babble.ctx = new C()
        }
        if (babble.ctx.state === 'suspended') babble.ctx.resume?.().catch(() => {})
        return babble.ctx
      }
      const loadBabble = async () => {
        if (babble.ready || babble.trying || babble.failed) return babble.ready
        // 正在退避就先不理，等下一次碎碎念或定时器再来
        if (babble.retryAt && Date.now() < babble.retryAt) return false
        babble.trying = true
        try {
          const [map, raw] = await Promise.all([
            fetch('/dsh-coo-pet/pet/asset?p=' + encodeURIComponent('speech/zh.json')).then((r) => r.json()),
            fetch('/dsh-coo-pet/pet/asset?p=' + encodeURIComponent('speech/zh.ogg')).then((r) => r.arrayBuffer()),
          ])
          const ctx = babbleCtx()
          babble.buffer = await ctx.decodeAudioData(raw)
          babble.units = map.units ?? {}
          babble.keys = Object.keys(babble.units)
          babble.ready = babble.keys.length > 0
          report('desk-voice', { mode: 'babble', units: babble.keys.length, seconds: Math.round(babble.buffer.duration) })
          if (babble.ready && babble.pending) {
            const line = babble.pending
            babble.pending = ''
            babbleSay(line)
          }
        } catch (error) {
          babble.attempts += 1
          babble.retryAt = Date.now() + BABBLE_BACKOFF
          if (babble.attempts >= BABBLE_TRIES) babble.failed = true
          report('desk-voice-error', {
            message: String((error && error.message) || error),
            attempts: babble.attempts,
            willRetry: !babble.failed,
          })
        }
        babble.trying = false
        return babble.ready
      }
      const babbleSay = (text) => {
        if (!babble.ready) {
          babble.pending = String(text ?? '')
          loadBabble()
          return
        }
        const ctx = babbleCtx()
        if (!ctx) return
        const rate = Number(prefs.voiceRate) > 0 ? Math.min(2, Number(prefs.voiceRate)) : 1
        const pitch = Number(prefs.voicePitch) > 0 ? Math.min(2, Number(prefs.voicePitch)) : 1
        const chars = [...String(text ?? '').replace(/\{[a-z]+\}/gi, '')].filter((ch) => !/\s/.test(ch)).slice(0, 60)
        let at = ctx.currentTime + 0.02
        const base = 1 / Math.max(0.5, pitch)
        for (const ch of chars) {
          const key = babble.keys[hashChar(ch) % babble.keys.length]
          const unit = babble.units[key]
          if (!unit) continue
          const src = ctx.createBufferSource()
          src.buffer = babble.buffer
          src.playbackRate.value = base * (0.94 + (hashChar(ch + 'x') % 13) / 100)
          const gain = ctx.createGain()
          gain.gain.value = 0.42
          src.connect(gain).connect(ctx.destination)
          src.start(at, unit[0], Math.min(0.16, unit[1]))
          at += unit[1] / Math.max(0.6, rate)
        }
      }

      const speak = (text) => {
        try {
          if (offDuty || prefs.voice === false) return
          // 咿呀模式优先走音库；音库没就绪就排队，绝不退回朗读
          if ((prefs.voiceMode ?? 'babble') === 'babble') {
            babbleSay(text)
            return
          }
          if (!('speechSynthesis' in window)) return
          const synth = window.speechSynthesis
          if (!voicesCache.length) warmVoices()
          const utter = new SpeechSynthesisUtterance(String(text).replace(/\{[a-z]+\}/gi, ''))
          const wantName = String(prefs.voiceName || '')
          let voice = wantName ? voicesCache.find((v) => v.name === wantName) : null
          if (!voice) voice = voicesCache.find((v) => /^(zh|cmn)/i.test(v.lang)) || voicesCache[0]
          if (voice) utter.voice = voice
          utter.lang = (voice && voice.lang) || 'zh-CN'
          const rate = Number(prefs.voiceRate) > 0 ? Number(prefs.voiceRate) : 1.05
          const pitch = Number(prefs.voicePitch) > 0 ? Number(prefs.voicePitch) : 1.15
          utter.rate = rate
          utter.pitch = pitch
          synth.cancel()
          synth.speak(utter)
        } catch {
          /* 没声音也行 */
        }
      }

      /* 回答朗读：插入会话的回答专用——气泡停久一点，声音完全跟随设置（咿呀就咿呀，tts 就朗读） */
      const answerSay = (text) => {
        if (!text) return
        // 回答到了：想完啦
        thinkingNow = false
        try { pet?.set?.({ thinking: false }) } catch { /* ignore */ }
        // 回答气泡一出就站住：不开新步子，正在走的路也立刻打断（正事在办时除外）
        try {
          pet?.set?.({ roam: 'off' })
          if (!launchWalk && !iconWalk && !seatWalk) pet?.stopWalk?.()
        } catch {
          /* ignore */
        }
        window.clearTimeout(thinkTimer)
        if (prefs.answerBubble !== false) {
          bubbleEl.textContent = text
          bubbleEl.classList.add('on')
          window.clearTimeout(bubbleTimer)
          bubbleTimer = window.setTimeout(() => {
            bubbleEl.classList.remove('on')
            if (!menuEl && (!chatEl || chatEl.classList.contains('hidden'))) applyRoam()
          }, 12000)
        }
        speak(text)
      }

      const placeBubble = () => {
        bubbleEl.style.left = Math.round(bubbleAnchor.x) + 'px'
        bubbleEl.style.top = Math.round(bubbleAnchor.y) + 'px'
      }

      /* ---------- 音效（现场合成，共 34 个） ---------- */
      let actx = null
      let sfxMaster = null
      let noiseBuf = null
      const ac = () => {
        if (!actx) {
          const C = window.AudioContext || window.webkitAudioContext
          if (!C) return null
          actx = new C()
          sfxMaster = actx.createGain()
          sfxMaster.gain.value = 0.55
          const comp = actx.createDynamicsCompressor()
          sfxMaster.connect(comp)
          comp.connect(actx.destination)
        }
        if (actx.state === 'suspended') actx.resume?.().catch(() => {})
        return actx
      }
      const R = (a, b) => a + Math.random() * (b - a)
      const tone = ({ type = 'sine', f0 = 440, f1 = f0, dur = 0.1, vol = 0.2, at = 0, attack = 0.005, vib = 0, vibRate = 0, filter = 0 }) => {
        const ctx = ac()
        if (!ctx) return
        const t0 = ctx.currentTime + at
        const osc = ctx.createOscillator()
        const amp = ctx.createGain()
        osc.type = type
        osc.frequency.setValueAtTime(f0, t0)
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur)
        if (vib) {
          const l = ctx.createOscillator()
          const lg = ctx.createGain()
          l.frequency.value = vibRate
          lg.gain.value = vib
          l.connect(lg)
          lg.connect(osc.frequency)
          l.start(t0)
          l.stop(t0 + dur + 0.05)
        }
        amp.gain.setValueAtTime(0.0001, t0)
        amp.gain.exponentialRampToValueAtTime(vol, t0 + attack)
        amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
        let node = osc
        if (filter) {
          const bq = ctx.createBiquadFilter()
          bq.type = 'lowpass'
          bq.frequency.value = filter
          osc.connect(bq)
          node = bq
        }
        node.connect(amp)
        amp.connect(sfxMaster)
        osc.start(t0)
        osc.stop(t0 + dur + 0.03)
      }
      const noise = ({ type = 'bandpass', f0 = 1000, f1 = f0, q = 1, dur = 0.2, vol = 0.15, at = 0, attack = 0.01 }) => {
        const ctx = ac()
        if (!ctx) return
        if (!noiseBuf) {
          noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate)
          const d = noiseBuf.getChannelData(0)
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
        }
        const t0 = ctx.currentTime + at
        const src = ctx.createBufferSource()
        const bq = ctx.createBiquadFilter()
        const amp = ctx.createGain()
        src.buffer = noiseBuf
        bq.type = type
        bq.Q.value = q
        bq.frequency.setValueAtTime(f0, t0)
        bq.frequency.exponentialRampToValueAtTime(f1, t0 + dur)
        amp.gain.setValueAtTime(0.0001, t0)
        amp.gain.exponentialRampToValueAtTime(vol, t0 + attack)
        amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
        src.connect(bq)
        bq.connect(amp)
        amp.connect(sfxMaster)
        src.start(t0, Math.random() * 0.5)
        src.stop(t0 + dur + 0.03)
      }
      const tones = {
        step(run, i) {
          const k = run ? 1.25 : 1
          tone({ f0: (i ? 520 : 440) * k, f1: (i ? 380 : 330) * k, dur: 0.06, vol: run ? 0.07 : 0.05 })
          if (run) noise({ f0: 2500, q: 0.8, dur: 0.05, vol: 0.03 })
        },
        skid() {
          noise({ type: 'highpass', f0: 1800, f1: 900, dur: 0.22, vol: 0.08 })
        },
        jump() {
          tone({ type: 'triangle', f0: 200, f1: 720, dur: 0.24, vol: 0.22, vib: 40, vibRate: 22 })
        },
        land(hard) {
          tone({ f0: hard ? 160 : 190, f1: 48, dur: hard ? 0.28 : 0.16, vol: hard ? 0.4 : 0.25 })
          noise({ type: 'lowpass', f0: hard ? 700 : 500, f1: 120, dur: 0.12, vol: hard ? 0.25 : 0.12 })
          if (hard) tone({ type: 'square', f0: 420, f1: 300, dur: 0.08, vol: 0.06, at: 0.02, filter: 1600 })
        },
        grab() {
          tone({ type: 'triangle', f0: 680, f1: 1500, dur: 0.14, vol: 0.18, vib: 60, vibRate: 30 })
        },
        squeak() {
          tone({ type: 'triangle', f0: R(900, 1200), f1: R(1300, 1700), dur: 0.09, vol: 0.08, vib: 40, vibRate: 35 })
        },
        whoosh() {
          noise({ f0: 300, f1: 2400, q: 1.4, dur: 0.38, vol: 0.22, attack: 0.08 })
        },
        chirps() {
          for (let i = 0; i < 3; i++) tone({ f0: 2300 + i * 120, f1: 3200, dur: 0.06, vol: 0.06, at: i * 0.11 })
        },
        shake() {
          for (let i = 0; i < 5; i++) tone({ type: 'square', f0: 180, f1: 160, dur: 0.05, vol: 0.05, at: i * 0.06, filter: 900 })
        },
        hmm() {
          tone({ type: 'triangle', f0: 330, f1: 360, dur: 0.12, vol: 0.08 })
          tone({ type: 'triangle', f0: 392, f1: 470, dur: 0.16, vol: 0.08, at: 0.14 })
        },
        yawn() {
          tone({ type: 'triangle', f0: 520, f1: 240, dur: 1, vol: 0.1, vib: 12, vibRate: 5, filter: 1500, attack: 0.15 })
        },
        snore() {
          noise({ type: 'lowpass', f0: 250, f1: 700, dur: 0.7, vol: 0.09, attack: 0.35 })
        },
        purr() {
          tone({ type: 'sawtooth', f0: 62, f1: 58, dur: 0.9, vol: 0.08, vib: 6, vibRate: 24, filter: 320, attack: 0.1 })
        },
        poke() {
          tone({ f0: 320, f1: 200, dur: 0.09, vol: 0.16 })
        },
        shiver() {
          for (let i = 0; i < 8; i++) tone({ type: 'square', f0: 900, f1: 820, dur: 0.03, vol: 0.035, at: i * 0.07, filter: 2400 })
        },
        look() {
          tones.hmm()
        },
        dance() {
          ;[523, 659, 784, 659, 880].forEach((fr, i) => tone({ type: 'triangle', f0: fr, dur: 0.13, vol: 0.09, at: i * 0.15 }))
        },
        nod() {
          tone({ type: 'triangle', f0: 520, f1: 440, dur: 0.07, vol: 0.08 })
          tone({ type: 'triangle', f0: 520, f1: 440, dur: 0.07, vol: 0.08, at: 0.2 })
        },
        spin() {
          tone({ type: 'triangle', f0: 300, f1: 1200, dur: 0.3, vol: 0.12, vib: 30, vibRate: 18 })
        },
        happy() {
          tone({ type: 'triangle', f0: 660, f1: 700, dur: 0.1, vol: 0.14 })
          tone({ type: 'triangle', f0: 990, f1: 1050, dur: 0.14, vol: 0.14, at: 0.09 })
        },
        wink() {
          tone({ f0: 1760, dur: 0.5, vol: 0.1 })
          tone({ f0: 2637, dur: 0.45, vol: 0.06, at: 0.04 })
        },
        love() {
          tone({ f0: 480, f1: 820, dur: 0.1, vol: 0.14 })
          tone({ f0: 600, f1: 1000, dur: 0.12, vol: 0.14, at: 0.13 })
        },
        surprised() {
          tone({ f0: 380, f1: 1500, dur: 0.2, vol: 0.16, vib: 15, vibRate: 12 })
        },
        angry() {
          tone({ type: 'sawtooth', f0: 120, f1: 95, dur: 0.5, vol: 0.12, vib: 12, vibRate: 14, filter: 700 })
        },
        sad() {
          tone({ type: 'triangle', f0: 440, f1: 392, dur: 0.3, vol: 0.13, vib: 8, vibRate: 6 })
          tone({ type: 'triangle', f0: 392, f1: 262, dur: 0.55, vol: 0.13, at: 0.3, vib: 10, vibRate: 5 })
        },
        shy() {
          tone({ f0: 1300, f1: 1600, dur: 0.07, vol: 0.07 })
          tone({ f0: 1450, f1: 1750, dur: 0.07, vol: 0.06, at: 0.1 })
        },
        tick() {
          tone({ f0: 1200, f1: 1000, dur: 0.03, vol: 0.05 })
        },
        pop() {
          tone({ f0: 240, f1: 720, dur: 0.07, vol: 0.14 })
        },
        sparkle() {
          ;[1568, 2093, 2637].forEach((fr, i) => tone({ f0: fr, dur: 0.25, vol: 0.06, at: i * 0.06 }))
        },
        select() {
          tone({ type: 'triangle', f0: 520, f1: 1040, dur: 0.1, vol: 0.12 })
        },
        babble(ch) {
          const n = typeof ch === 'string' && ch ? ch.codePointAt(0) : Math.floor(Math.random() * 0xffff)
          const fr = (330 + (n % 9) * 28) * 1
          tone({ type: 'square', f0: fr, f1: fr * R(0.85, 1.1), dur: 0.05, vol: 0.05, filter: 1800 })
        },
        blub() {
          tone({ f0: R(500, 700), f1: R(900, 1200), dur: 0.05, vol: 0.05 })
        },
        listenStart() {
          tone({ f0: 880, dur: 0.12, vol: 0.1 })
          tone({ f0: 1320, dur: 0.16, vol: 0.1, at: 0.1 })
        },
        listenEnd() {
          tone({ f0: 1320, dur: 0.1, vol: 0.09 })
          tone({ f0: 990, dur: 0.16, vol: 0.09, at: 0.09 })
        },
      }
      const chime = (name, ...args) => {
        try {
          report('desk-sfx', { name, ctx: actx ? actx.state : 'none', master: !!sfxMaster })
          if (prefs.sfx === false || offDuty) return
          if (Object.hasOwn(tones, name)) tones[name](...args)
        } catch (e) {
          report('desk-sfx-err', { name, err: String((e && (e.stack || e.message)) || e) })
        }
      }

      const loadImage = (url) =>
        new Promise((resolve, reject) => {
          const img = new Image()
          img.onload = () => resolve(img)
          img.onerror = () => reject(new Error('image failed: ' + url))
          img.src = url
        })

      let prefs = { look: 'deepseek', outfit: 'maid', size: 190, idleLines: '', answerBubble: true, idleBubble: true, greet: true, sfx: true }
      try {
        const body = await fetch('/dsh-coo-pet/prefs', { credentials: 'same-origin' }).then((res) => res.json())
        if (body && body.config) prefs = body.config
      } catch {
        /* 默认值兜底 */
      }

      const splitLines = (text) => {
        const who = String(prefs.petName || '').trim() || '你的鱼'
        return String(text ?? '')
          .split('\n')
          .map((line) => line.trim().replace(/\{name\}/g, who))
          .filter(Boolean)
      }
      let lines = splitLines(prefs.idleLines)

      const idleMs = () => {
        const unit = prefs.idleUnit === 'sec' ? 1000 : prefs.idleUnit === 'hour' ? 3600000 : 60000
        const every = Number(prefs.idleEvery) > 0 ? Number(prefs.idleEvery) : 20
        return Math.max(2000, every * unit)
      }

      let pet = null
      let hit = { x: 0, y: 0, w: 0, h: 0 }

      /* 小跟随窗：世界 = 整块工作区，窗口只是世界上的一个取景框 */
      let worldSize = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight }
      let origin = { x: 0, y: 0 }
      const toLocalX = (v) => v - origin.x
      const toLocalY = (v) => v - origin.y
      const applyView = () => {
        stage.style.width = worldSize.w + 'px'
        stage.style.height = worldSize.h + 'px'
        stage.style.transform = 'translate(' + -origin.x + 'px,' + -origin.y + 'px)'
      }

      try {
        const meta = await desk.world()
        if (meta && meta.world && meta.world.w) worldSize = meta.world
        if (meta && meta.origin) origin = meta.origin
        applyView()
      } catch {
        /* 拿不到就按窗口大小先跑 */
      }
      try {
        desk.onOrigin((payload) => {
          if (!payload) return
          if (payload.world && payload.world.w) worldSize = payload.world
          if (payload.origin) origin = payload.origin
          applyView()
        })
      } catch {
        /* ignore */
      }
      let anchorSentAt = 0
      const publishAnchor = (box) => {
        if (!box) return
        const now = Date.now()
        if (now - anchorSentAt < 120) return
        anchorSentAt = now
        try {
          desk.anchor({ x: box.x + box.w / 2, y: box.y + box.h, bias: 0.42, moving: box.mode === 'walk' || box.mode === 'run' || box.mode === 'drag' || box.mode === 'air' })
        } catch {
          /* ignore */
        }
      }
      let dragging = false
      let inside = false
      let seatWalk = null // 走过去再坐：进行中的坐下行走
      let iconWalk = null // 走过去再搬图标：进行中的挪图行走（phase 1 走到图标前 / phase 2 抱着走）
      let launchWalk = null // 指令开软件：小跑到目标位准备戳按的行走
      let carry = null // 搬运中的小包裹标记（非空 = 正举着东西）
      let carryG = null // 搬运牌子的 SVG 覆盖层
      let stayMode = false // 原地模式：开关在菜单里（点菜单里的「原地待着」），不再是点她切换
      let thinkingNow = false // 等回复中：也算原地待着的理由，想完再动
      let busy = false // DSH 正在跑任务（含思考/执行工具）：原地站住，别溜达别搬图标
      let lastActive = 0 // DSH 最近一次活动时间（干活节流用）
      // 统一的 roam 设置口：原地模式优先，其次看 prefs.wander
      // 对话框/菜单只要在桌面上就禁跑（不管消息发没发），防止别的时机把 roam 放回 free
      const uiOccupying = () => !!menuEl || !!(chatEl && !chatEl.classList.contains('hidden'))
      // 本体状态闸：所有会按住她的状态（原地待着/值日/睡觉/思考/干活/语音/界面占用）
      const heldRoam = () => !!(stayMode || offDuty || napping || thinkingNow || busy || voiceHeld || uiOccupying())
      const mainRoamFree = () => !heldRoam() && prefs.wander !== false
      const applyRoam = () => {
        try {
          pet?.set?.({ roam: mainRoamFree() ? 'free' : 'off' })
        } catch {
          /* ignore */
        }
        try { applyCloneRoam() } catch { /* ignore */ }
      }
      // 原地模式的两个固定项：点「原地待着」必定待着，点「自由活动」必定恢复，点多少下都一样
      const setStay = (on) => {
        stayMode = on
        try { pet?.stopWalk?.() } catch { /* ignore */ }
        seatWalk = null
        seat = null
        if (on && (iconWalk || carry)) {
          iconWalk = null
          carry = null
          hideCarry()
        }
        applyRoam()
        say(on ? '那我就待在这儿啦' : '又出来溜达咯')
      }

      // 安静模式：静音、不溜达、不碎碎念不搬图标不乱坐；仍可拖拽、点她、对话框照常能用（只是不出声）
      const setOffDuty = (on) => {
        offDuty = on
        try { localStorage.setItem('coo-offduty', on ? '1' : '0') } catch { /* ignore */ }
        try { pet?.stopWalk?.() } catch { /* ignore */ }
        if (on && (iconWalk || carry)) {
          iconWalk = null
          carry = null
          hideCarry()
        }
        try { pet?.set?.({ dialogOpen: on }) } catch { /* ignore */ }
        applyRoam()
      }

      /* ---------- 快捷指令配套：番茄钟（本地定时，不麻烦 AI） ---------- */
      let pomoTimer = 0
      const startPomodoro = () => {
        window.clearTimeout(pomoTimer)
        say('番茄钟开始！25 分钟后我叫你~')
        try { pet?.setExpr?.('determined') } catch { /* ignore */ }
        pomoTimer = window.setTimeout(() => {
          pomoTimer = 0
          say('番茄钟到啦！休息 5 分钟，起来走走~')
          try { pet?.act?.('hop'); pet?.setExpr?.('excited') } catch { /* ignore */ }
        }, 25 * 60 * 1000)
      }
      const stopPomodoro = (manual) => {
        if (!pomoTimer) {
          if (manual) say('现在没有进行中的番茄钟呀')
          return
        }
        window.clearTimeout(pomoTimer)
        pomoTimer = 0
        if (manual) say('好，番茄钟取消了~')
      }

      const S = () => Math.max(0.18, Math.min(1.6, (prefs.size || 190) / 256))

      // 她能站的最低脚位：身体高度 ≈ size * 1.15，再留一点余量
      const minFeet = () => Math.round((Number(prefs.size) > 0 ? Number(prefs.size) : 190) * 1.2) + 8
      let seat = null // 坐下的时候临时把「地面」抬到那一条边
      let looseGround = null // 被放到半空后，落点就是她新的地面（不坠落）
      const bounds = () => ({
        W: worldSize.w,
        H: worldSize.h,
        floorY:
          typeof seat === 'number'
            ? seat
            : typeof looseGround === 'number'
              ? looseGround
              : worldSize.h - (Number(prefs.marginBottom) >= 0 ? Number(prefs.marginBottom) : 8),
        S: S(),
      })

      const sendHit = (next) => {
        if (next === inside) return
        inside = next
        desk.hit(next)
      }
      // 命中框交给主进程，由它轮询指针位置决定这一层要不要吃点击
      let boxSentAt = 0
      const unionBox = (a, b) => ({
        x: Math.min(a.x, b.x),
        y: Math.min(a.y, b.y),
        w: Math.max(a.x + a.w, b.x + b.w) - Math.min(a.x, b.x),
        h: Math.max(a.y + a.h, b.y + b.h) - Math.min(a.y, b.y),
      })
      const publishBox = (force) => {
        const now = Date.now()
        if (!force && now - boxSentAt < 260) return
        boxSentAt = now
        let box = hit
        const extra = []
        try {
          // 分身各自的矩形也交给主进程：透明窗按「光标在哪个框里」决定接不接鼠标
          for (const b of cloneBoxes()) extra.push(b)
          // 输入框/菜单开着时把它们各自的矩形也交上去：透明窗只认这些框决定接不接鼠标
          if (chatEl && !chatEl.classList.contains('hidden')) {
            const cr = chatEl.getBoundingClientRect()
            if (cr.width > 0 && cr.height > 0) extra.push({ x: cr.left, y: cr.top, w: cr.width, h: cr.height })
          }
          if (menuEl) {
            const mr = menuEl.getBoundingClientRect()
            if (mr.width > 0 && mr.height > 0) extra.push({ x: mr.left, y: mr.top, w: mr.width, h: mr.height })
          }
        } catch {
          /* ignore */
        }
        try {
          desk.hitbox([box, ...extra])
        } catch {
          /* ignore */
        }
      }

      const inHit = (x, y) => x >= hit.x && y >= hit.y && x <= hit.x + hit.w && y <= hit.y + hit.h

      /* ---------- 影分身：全真实例 ----------
         每只分身就是一个完整的本体（kit.createBody + 独立 figure 实例）：同一套模型与
         引擎，真步态、真眨眼、真睡姿、真表情、真拖拽手感——和本体唯一的区别是：
         不接 emit（没有碎碎念气泡），不参与图标互动，音效只放脚步声（限流防吵）。
         渲染走本体同款 raster 路径（透明窗合成不了 GL 画布，见 createWhaleBody 处的
         注释），帧率压到 12fps 压住读回开销。数量不加限制：点 x1 来 1 只、x10 来
         10 只、x50 来 50 只，全真实例要多少来多少（用户确认不考虑 CPU）。 */
      const CLONE_RASTER_FPS = 12 // 分身每秒最多转 12 帧（本体 24）：小动作看起来依旧顺滑
      let clones = [] // { bp(本体实例), layer(挂她自己的 svg.kit 的 fixed 层) }
      let cloneFrozen = false // 兼容旧 act（cloneFreeze）：为 true 时等同 cloneMode='frozen'
      let cloneMode = 'free' // 分身自己的行为档位（只管分身，跟本体「原地待着/自由活动」互不影响）：free 自由活动 / idle 原地待机 / frozen 立定不动
      let cloneTarget = null // 右键菜单当前指向的分身
      let cloneDrag = null // 正在被左键拖动的分身 { c, vx, vy, lt, lx, ly }
      let cloneMenuAt = 0 // 上次右键弹分身菜单的时间（去抖：pointerdown 已弹过就不再重复弹）
      let cloneStepAt = 0 // 脚步声限流的全局最小间隔
      // 分身的容器：body 层 fixed（#stage 是 will-change:transform 的合成层，动态往里
      // 加的覆盖层会被透明窗合成器整个丢掉——画布里有像素、屏幕上不显示）。插在
      // #stage 之前：分身画在本体身后。
      const cloneStage = document.createElement('div')
      cloneStage.id = 'clone-stage'
      cloneStage.style.cssText = 'position:fixed;left:0;top:0;pointer-events:none;width:100vw;height:100vh;'
      document.body.insertBefore(cloneStage, document.getElementById('stage'))
      // 脚步声限流：一群分身齐步走也不吵（90ms 全局最小间隔 + 45% 概率）
      const stepSfx = () => {
        const now = performance.now()
        if (now - cloneStepAt < 90 || Math.random() > 0.45) return
        cloneStepAt = now
        chime('step')
      }
      // 分身跟随设置：只有明确按住本体的状态（原地待着/值日/睡觉/干活…）才按住分身；
      // 「溜达」开关只管本体走不走动，不管分身——影分身之术召出来就是要满屏跑的
      const cloneRoamMode = () => (!heldRoam() && cloneMode === 'free' ? 'free' : 'off')
      const applyCloneRoam = () => {
        const roam = cloneRoamMode()
        for (const c of clones) {
          try { c.bp.set({ roam }) } catch { /* ignore */ }
        }
      }
      const applyCloneMode = () => {
        const roam = cloneRoamMode()
        for (const c of clones) {
          try {
            c.bp.set({ roam, still: cloneMode === 'frozen' })
          } catch {
            /* ignore */
          }
        }
      }
      // 分身当前的可视矩形（世界坐标）：直接量她自己的 foreignObject——全真实例自己管
      // 姿势（躺/坐/压扁/被拎），矩形跟着真实画面走，命中框所见即所得
      const cloneRect = (c) => {
        try {
          const el = c.layer.querySelector('svg.kit foreignObject') || c.layer.querySelector('svg.kit image')
          if (!el) return null
          const r = el.getBoundingClientRect()
          if (!r.width || !r.height) return null
          return { x: r.left + origin.x, y: r.top + origin.y, w: r.width, h: r.height }
        } catch {
          return null
        }
      }
      const cloneBoxes = () => clones.map(cloneRect).filter(Boolean)
      const cloneAt = (x, y) => {
        for (let i = clones.length - 1; i >= 0; i--) {
          const r = cloneRect(clones[i])
          if (r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return clones[i]
        }
        return null
      }
      const dismissClone = (c) => {
        const i = clones.indexOf(c)
        if (i < 0) return
        clones.splice(i, 1)
        try { c.bp.dispose() } catch { /* ignore */ }
        c.layer.remove()
      }
      const dismissAllClones = () => {
        const n = clones.length
        while (clones.length) dismissClone(clones[0])
        cloneTarget = null
        cloneDrag = null
        if (n) say('分身都收回来了')
      }
      const spawnClones = async (n) => {
        if (!kit || !pack || !buildCloneBody) return
        const count = Math.max(1, Math.round(Number(n) || 0))
        const gy = bounds().floorY
        const bx = hit ? hit.x + hit.w / 2 : worldSize.w - 220
        for (let i = 0; i < count; i++) {
          // 绕着本体扇形散开落位，避免全叠在本体脚边
          const side = i % 2 === 0 ? 1 : -1
          let x = bx + side * (90 + Math.random() * 560 + (i > 1 ? Math.random() * 320 : 0))
          if (x < 60 || x > worldSize.w - 60) x = Math.random() * (worldSize.w - 120) + 60
          const layer = document.createElement('div')
          layer.style.cssText = 'position:fixed;left:0;top:0;pointer-events:none;width:100%;height:100%;'
          cloneStage.appendChild(layer)
          try {
            const bp = await buildCloneBody(layer, {
              x: Math.round(x),
              y: gy,
              facing: Math.random() < 0.5 ? -1 : 1,
            })
            bp.set({ roam: cloneRoamMode(), still: cloneMode === 'frozen' })
            clones.push({ bp, layer })
          } catch (e) {
            layer.remove()
            try { report('clone-live-err', { m: String((e && e.message) || e) }) } catch { /* ignore */ }
          }
        }
        say('影分身之术！' + clones.length + ' 只就位')
        try { publishBox(true) } catch { /* ignore */ }
      }

      /* ---------- 菜单 / 输入框 ---------- */
      let menuEl = null
      const closeMenu = () => {
        if (menuWatch) {
          document.removeEventListener('pointerdown', menuWatch, true)
          menuWatch = null
        }
        if (menuEl) {
          menuEl.remove()
          menuEl = null
        }
        try {
          desk.menu(false)
        } catch {
          /* ignore */
        }
        try {
          pet?.set?.({ dialogOpen: false })
          applyRoam()
        } catch {
          /* ignore */
        }
      }
      const openApp = (target) => {
        fetch('/dsh-coo-pet/open', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ target }),
        }).catch(() => {})
      }
      // 一键复位：按名字把她搬乱的图标写回最新一档快照并弹出该档；连按可连撤
      const restoreIconsAll = async () => {
        iconWalk = null
        carry = null
        hideCarry()
        try { pet?.stopWalk?.() } catch { /* ignore */ }
        let ok = false
        try {
          const r = await desk.restoreIcons?.()
          ok = !!(r && r.ok)
        } catch { /* ignore */ }
        iconCache = { at: 0, data: [] }
        say(ok ? '图标归位啦' : '没有可用的图标快照')
        return ok
      }
      // 一键全复位：把历史栈里的快照一档档全部撤光，回到她第一次搬乱前的样子
      const restoreIconsAllEvery = async () => {
        try { report('restore-all-call', { hasApi: typeof desk.restoreIconsAll }) } catch { /* ignore */ }
        iconWalk = null
        carry = null
        hideCarry()
        try { pet?.stopWalk?.() } catch { /* ignore */ }
        let r = null
        try {
          r = await desk.restoreIconsAll?.()
        } catch (e) {
          try { report('restore-all-err', { m: String((e && e.message) || e) }) } catch { /* ignore */ }
        }
        try { report('restore-all-res', { ok: !!(r && r.ok), restored: (r && r.restored) || 0, err: (r && r.error) || '' }) } catch { /* ignore */ }
        iconCache = { at: 0, data: [] }
        say(r && r.ok ? '全部归位啦，回到最初的样子' : '没有可用的图标快照')
        return !!(r && r.ok)
      }
      const MENU_NAMES = {
        open: '打开DSH',
        input: '输入…',
        restart: '重启DSH',
        reset: '图标复位',
        resetAll: '一键全复位',
        clone: '影分身',
        stay: '原地待着',
        free: '自由活动',
        duty: '安静模式',
        actions: '特殊动作',
        look: '换形象',
        outfit: '换衣服',
        none: '藏起来',
      }
      const menuItems = () => {
        // 老版短排序兑底：旧配置只有五项（open,input,voice,close,none），换形象/换衣服这些
        // 新功能永远出不来——检测到就直接换成新版全项；自定义过的排序不动
        const LEGACY = 'open,input,voice,close,none'
        let orderStr = String((prefs && prefs.menuOrder) || '')
        if (!orderStr.trim() || orderStr.replace(/\s/g, '') === LEGACY) {
          orderStr = 'open,input,restart,reset,resetAll,stay,free,duty,actions,look,outfit,clone,none'
        }
        let order = orderStr
          .split(',')
          .map((s) => s.trim())
          .filter((id) => MENU_NAMES[id])
        // 新功能项补位：老自定义排序里没有的新项，插到「藏起来」前面
        for (const nid of ['resetAll', 'clone']) {
          if (!order.includes(nid)) {
            const idx = order.indexOf('none')
            if (idx >= 0) order.splice(idx, 0, nid)
            else order.push(nid)
          }
        }
        // 排序以设置页保存的 menuOrder 为唯一来源：删了就是删了，要找回在设置页点「加回」
        const seen = {}
        const out = []
        for (const id of order) {
          if (seen[id]) continue
          seen[id] = true
          if (id === 'open') out.push(['打开DSH', () => openApp('dsh')])
          else if (id === 'input') out.push(['输入…', () => openChat()])
          else if (id === 'restart') out.push(['重启DSH', () => {
            closeMenu()
            say('我去重启啦，马上回来~')
            window.setTimeout(async () => {
              try { await desk.restartDsh?.() } catch { /* 重启脚本接管 */ }
            }, 1200)
          }])
          else if (id === 'reset') out.push(['图标复位', () => { restoreIconsAll(); closeMenu() }])
          else if (id === 'resetAll') out.push(['一键全复位', () => { restoreIconsAllEvery(); closeMenu() }])
          else if (id === 'stay') out.push(['原地待着', () => { setStay(true); closeMenu() }])
          else if (id === 'free') out.push(['自由活动', () => { setStay(false); closeMenu() }])
          else if (id === 'duty') out.push([offDuty ? '关闭安静模式' : '安静模式', () => {
            closeMenu()
            if (!offDuty) {
              say('好，那我安静会儿~')
              setOffDuty(true)
            } else {
              setOffDuty(false)
              say('安静模式关闭，我又活蹦乱跳咯！')
            }
          }])
          else if (id === 'actions') out.push(['特殊动作›', () => openMenu(menuAnchor.x, menuAnchor.y, 'actions')])
          else if (id === 'look') out.push(['换形象›', () => openMenu(menuAnchor.x, menuAnchor.y, 'look')])
          else if (id === 'outfit') out.push(['换衣服›', () => openMenu(menuAnchor.x, menuAnchor.y, 'outfit')])
          else if (id === 'clone') out.push(['影分身›', () => openMenu(menuAnchor.x, menuAnchor.y, 'clones')])
          else if (id === 'none') out.push(['藏起来', () => setDisplay('none')])
        }
        return out
      }
      /* ---------- 换形象 / 换衣服：改 prefs 后页面会自动重载换装 ---------- */
      const LOOKS = [
        ['deepseek', '深蓝经典'], ['claude', '橘色'], ['chatgpt', '青绿'], ['gemini', '蓝白'],
        ['kimi', '银灰'], ['qwen', '紫调'], ['minimax', '暖橙'], ['harness', '暗金'],
      ]
      const OUTFITS = [['maid', '女仆装'], ['cape', '披风'], ['crew', '水手服']]
      const lookItems = () => LOOKS.map(([id, label]) => [
        (((prefs.look || 'deepseek') === id ? '· ' : '') + label + '（' + id + '）'),
        () => { savePrefs({ look: id }); closeMenu(); say('换件新衣裳～') },
      ])
      const outfitItems = () => OUTFITS.map(([id, label]) => [
        (((prefs.outfit || 'maid') === id ? '· ' : '') + label),
        () => { savePrefs({ outfit: id }); closeMenu(); say('换件新衣裳～') },
      ])
      // 切分身行为档位：只动分身，本体照旧（她的「原地待着/自由活动」是另一套）
      const setCloneMode = (m) => {
        cloneMode = m === 'idle' || m === 'frozen' ? m : 'free'
        applyCloneMode()
        try { say(cloneMode === 'free' ? '分身自由活动～' : cloneMode === 'idle' ? '分身原地待机（还喘气呢）' : '分身都定格了') } catch { /* ignore */ }
      }
      const cloneSpawnItems = () => [
        ['x1', () => { closeMenu(); spawnClones(1) }],
        ['x10', () => { closeMenu(); spawnClones(10) }],
        ['x50', () => { closeMenu(); spawnClones(50) }],
        ['取消分身', () => { closeMenu(); dismissAllClones() }],
      ]
      const cloneMenuItems = () => {
        const one = cloneTarget
        return [
          ['解除分身', () => {
            if (one) dismissClone(one)
            closeMenu()
          }],
          ['解除全部分身', () => { dismissAllClones(); closeMenu() }],
        ]
      }

      /* ---------- 动作 / 表情：引擎里现成但一直没入口的一批 ---------- */
      const ACTIONS = [
        ['点头', 'nod'], ['摇头', 'shake'], ['转圈', 'spin'], ['挥手', 'wave'], ['鞠躬', 'bow'],
        ['发抖', 'shiver'], ['扑腾', 'flap'], ['跳舞', 'dance'], ['晕一下', 'dizzy'], ['原地跳', 'hop'],
        ['跳一下', 'jump'], ['张望', 'look'], ['转个身', 'turn'], ['坐下', 'sit'], ['打个盹', 'sleep'],
      ]
      const EXPRESSIONS = [
        ['开心', 'happy'], ['眨眼', 'wink'], ['爱心眼', 'love'], ['害羞', 'shy'], ['惊讶', 'surprised'],
        ['生气', 'angry'], ['难过', 'sad'], ['犯困', 'sleepy'], ['思考', 'thinking'], ['得意', 'smug'],
        ['嘟嘴', 'pout'], ['担心', 'worried'], ['认真', 'determined'], ['慌张', 'flustered'], ['吓到', 'scared'],
        ['兴奋', 'excited'], ['掉眼泪', 'cry'], ['疑惑', 'confused'],
      ]
      const performAction = (kind, id) => {
        closeMenu()
        try {
          if (kind === 'expr') pet?.setExpr?.(id)
          else if (pet?.act?.(id) === false) say('现在做不了这个动作')
        } catch {
          /* ignore */
        }
      }
      const actionItems = () => {
        const out = [
          ['随机来一个', () => {
            const pool = []
            for (const [, id] of ACTIONS) pool.push(['act', id])
            for (const [, id] of EXPRESSIONS) pool.push(['expr', id])
            const pick = pool[Math.floor(Math.random() * pool.length)]
            performAction(pick[0], pick[1])
          }],
        ]
        for (const [label, id] of ACTIONS) out.push([label, () => performAction('act', id)])
        for (const [label, id] of EXPRESSIONS) out.push(['表情' + label, () => performAction('expr', id)])
        return out
      }
      const savePrefs = (patch) => {
        Object.assign(prefs, patch)
        fetch('/dsh-coo-pet/prefs', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(patch),
        }).catch(() => {})
      }
      const zhVoices = () => {
        try {
          const all = window.speechSynthesis ? window.speechSynthesis.getVoices() : []
          return all.filter((v) => /^(zh|cmn)/i.test(v.lang || '')).slice(0, 6)
        } catch {
          return []
        }
      }
      const voiceItems = () => {
        const out = [
          [(prefs.voiceMode !== 'tts' ? '· ' : '') + '咿呀声（她的音库）', () => { savePrefs({ voiceMode: 'babble' }); closeMenu() }],
          [(prefs.voiceMode === 'tts' ? '· ' : '') + '系统朗读', () => { savePrefs({ voiceMode: 'tts' }); closeMenu() }],
        ]
        for (const v of zhVoices()) {
          out.push([v.name, () => { savePrefs({ voiceMode: 'tts', voiceName: v.name }); closeMenu() }])
        }
        if (out.length <= 2) out.push(['（系统里没有中文音色）', () => closeMenu()])
        return out
      }
      const setDisplay = (value) => {
        fetch('/dsh-coo-pet/prefs', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ display: value }),
        }).catch(() => {})
        if (value === 'none') desk.hit(false)
      }
      let menuWatch = null
      let menuAnchor = { x: 0, y: 0 }
      const openMenu = (x, y, view = 'main') => {
        try { report('menu-open', { view, x: Math.round(x), y: Math.round(y) }) } catch { /* ignore */ }
        // 换视图时沿用当前列表的位置（拖过就不弹回她头顶）
        const carried = menuEl ? { x: parseFloat(menuEl.style.left) || 0, y: parseFloat(menuEl.style.top) || 0 } : null
        closeMenu()
        menuAnchor = { x, y }
        // 打开列表时她原地等着，别乱跑（roam 'off' 止走动，dialogOpen 止自选动作）
        try {
          pet?.set?.({ roam: 'off', dialogOpen: true })
          pet?.stopWalk?.()
        } catch {
          /* ignore */
        }
        menuWatch = (event) => {
          if (menuEl && menuEl.contains(event.target)) return
          closeMenu()
        }
        setTimeout(() => document.addEventListener('pointerdown', menuWatch, true), 0)
        // 列表开着的时候窗口不吃「穿透」，否则点外面点不到这边、菜单关不掉
        try {
          desk.menu(true)
        } catch {
          /* ignore */
        }
        const el = document.createElement('div')
        el.className = 'menu'
        if (carried) {
          el.style.left = carried.x + 'px'
          el.style.top = carried.y + 'px'
        } else {
          el.style.left = Math.max(8, Math.min(window.innerWidth - 168, toLocalX(x))) + 'px'
          el.style.top = Math.max(8, Math.min(window.innerHeight - 230, toLocalY(y))) + 'px'
        }
        const head = document.createElement('div')
        head.className = 'menu-head'
        const VIEW_HEADS = { voice: '‹换声音', actions: '‹特殊动作', look: '‹换形象', outfit: '‹换衣服', clones: '‹影分身', clone: '‹返回' }
        head.textContent = view === 'main' ? String((prefs && prefs.petName) || '你的鱼') : (VIEW_HEADS[view] || '‹ 返回')
        head.style.cursor = 'grab'
        head.title = '按住拖动列表'
        head.addEventListener('click', (event) => {
          event.stopPropagation()
          if (menuDrag && menuDrag.moved) return
          if (view !== 'main') openMenu(menuAnchor.x, menuAnchor.y, 'main')
        })
        head.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return
          menuDrag = { sx: event.clientX, sy: event.clientY, ox: parseFloat(el.style.left) || 0, oy: parseFloat(el.style.top) || 0, moved: false }
        })
        el.appendChild(head)
        const rows = view === 'voice' ? voiceItems() : view === 'actions' ? actionItems() : view === 'look' ? lookItems() : view === 'outfit' ? outfitItems() : view === 'clones' ? cloneSpawnItems() : view === 'clone' ? cloneMenuItems() : menuItems()
        for (const [label, run] of rows) {
          const item = document.createElement('div')
          item.className = 'menu-item'
          item.textContent = label
          item.addEventListener('click', (event) => {
            event.stopPropagation()
            run()
          })
          el.appendChild(item)
        }
        if (rows.length > 12) {
          el.style.maxHeight = Math.round(window.innerHeight * 0.72) + 'px'
          el.style.overflowY = 'auto'
        }
        document.body.appendChild(el)
        menuEl = el
        // 按实际尺寸防出屏：屏幕边缘也保证完整显示（覆盖旧的高度估算）
        clampMenuToScreen(el)
      }

      // 列表拖动状态：按住标题栏拖，移动超过 4px 才算拖（不误伤点击返回）
      let menuDrag = null
      const clampMenuToScreen = (el) => {
        const w = el.offsetWidth
        const h = el.offsetHeight
        el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, parseFloat(el.style.left))) + 'px'
        el.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, parseFloat(el.style.top))) + 'px'
      }
      document.addEventListener('pointermove', (event) => {
        if (!menuEl || !menuDrag) return
        const dx = event.clientX - menuDrag.sx
        const dy = event.clientY - menuDrag.sy
        if (!menuDrag.moved && Math.abs(dx) + Math.abs(dy) < 4) return
        menuDrag.moved = true
        menuEl.style.left = Math.max(8, Math.min(window.innerWidth - menuEl.offsetWidth - 8, menuDrag.ox + dx)) + 'px'
        menuEl.style.top = Math.max(8, Math.min(window.innerHeight - menuEl.offsetHeight - 8, menuDrag.oy + dy)) + 'px'
      })
      document.addEventListener('pointerup', (event) => {
        if (!menuDrag) return
        const wasDrag = menuDrag.moved
        menuDrag = null
        if (wasDrag && menuEl) {
          event.stopPropagation()
          menuEl.style.cursor = ''
        }
      }, true)

      const openChat = (wantFocus = true) => {
        closeMenu()
        try {
          pet?.set?.({ roam: 'off', dialogOpen: true })
          pet?.stopWalk?.()
        } catch {
          /* ignore */
        }
        chatEl.classList.remove('hidden')
        const box = hit
        chatEl.style.left = Math.max(8, Math.min(window.innerWidth - 280, toLocalX(box.x + box.w / 2 - 134))) + 'px'
        chatEl.style.top = Math.max(8, Math.min(window.innerHeight - 120, toLocalY(box.y) - 92)) + 'px'
        publishBox(true)
        if (wantFocus === false) return
        // 借键盘：窗口平时 focusable:false，打字前临时要焦点
        try {
          desk?.chatFocus?.(true)
        } catch {
          /* ignore */
        }
        chatText.focus()
        report('dbg-chat-open', {})
      }
      const closeChat = () => {
        chatEl.classList.add('hidden')
        // 关一次就清空：不保留上次输入的内容
        try {
          chatText.value = ''
          chatText.placeholder = '跟她说一句…'
        } catch {
          /* ignore */
        }
        try {
          desk?.chatFocus?.(false)
        } catch {
          /* ignore */
        }
        try {
          pet?.set?.({ dialogOpen: false })
          applyRoam()
        } catch {
          /* ignore */
        }
        publishBox(true)
      }
      document.getElementById('chat-close').addEventListener('click', closeChat)
      document.getElementById('chat-send').addEventListener('click', () => submitChat())
      chatText.addEventListener('keydown', (event) => {
        event.stopPropagation()
        // 诊断：确认按键真的到达输入框（遥测只留最后一条）
        report('dbg-chat-key', { key: event.key, composing: event.isComposing ? 1 : 0 })
        // 输入法选字/确认用的 Enter（isComposing）不能当成发送
        if (event.isComposing || event.keyCode === 229) return
        if (event.key === 'Enter') submitChat()
        if (event.key === 'Escape') closeChat()
      })
      // 点对话框任意处都补借一次键盘：窗口平时 focusable:false，
      // 焦点被别的窗口抢走后 Enter 会失灵——点一下输入框就恢复
      chatEl.addEventListener('pointerdown', () => {
        try {
          desk.chatFocus?.(true)
        } catch {
          /* ignore */
        }
      })
      /* ---------- 指令开软件：识别「打开X」，小跑过去戳一下，然后真的启动 ---------- */
      let thinkTimer = null
      // 「等回复」也原地待着：想着的时候不开新步子，想完（或 45 秒安全阀到）恢复
      const clearThinking = () => {
        thinkingNow = false
        try { pet?.set?.({ thinking: false }) } catch { /* ignore */ }
        applyRoam()
      }
      const startThinking = () => {
        thinkingNow = true
        try {
          pet?.set?.({ thinking: true, roam: 'off' })
          // 想的时候也不走：正在走的路立刻站住（正事在办时除外）
          if (!launchWalk && !iconWalk && !seatWalk) pet?.stopWalk?.()
        } catch {
          /* ignore */
        }
        window.clearTimeout(thinkTimer)
        // 安全阀：最多想 45 秒，回不来就自己缓过神
        thinkTimer = window.setTimeout(clearThinking, 45000)
      }
      const LAUNCH_RE = /^(?:帮我|麻烦|请)?(?:打开|启动|运行|开一下|开个|开启)\s*([^，。!?\s]{1,24}?)\s*(?:软件|程序|应用)?[吧呀呢]?$/
      const performTapAndLaunch = (name) => {
        try { pet?.act?.('hop') } catch { /* ignore */ }
        try { pet?.setExpr?.('happy') } catch { /* ignore */ }
        Promise.resolve()
          .then(() => desk.launch(name))
          .then((res) => {
            if (res && res.ok) say('打开咯：' + (res.app || name))
            else say('没找到「' + name + '」，我认不出这个名字')
          })
          .catch(() => say('打开失败了，你再试试？'))
      }
      const launchTheater = async (name) => {
        // 菜单/输入框开着就不做带行走的开场（她得原地待着），直接启动
        // 注意：服务端 busy（DSH 会话在跑）不拦这里——她正是在执行用户的开软件指令
        if (!pet || stayMode || dragging || menuEl || !(chatEl && chatEl.classList.contains('hidden'))) {
          report('dbg-launch-skip', { why: !pet ? 'no-pet' : stayMode ? 'stayMode' : dragging ? 'dragging' : menuEl ? 'menu' : 'chat-open', name })
          performTapAndLaunch(name)
          return
        }
        // 先在桌面上找这个名字的图标：找到了就走到它旁边，站定戳一下再启动
        let icon = null
        try {
          const res = await desk.icons()
          const list = res && res.ok && Array.isArray(res.data) ? res.data : []
          const want = String(name || '').toLowerCase()
          for (const it of list) {
            const nm = String(it.name || '').replace(/\.lnk$/i, '').toLowerCase()
            if (!nm) continue
            if ((nm === want || nm.includes(want) || want.includes(nm)) && (!icon || nm.length < icon._nm.length)) {
              icon = { ...it, _nm: nm }
            }
          }
          report('dbg-launch-icons', { name, count: list.length, matched: icon ? icon.name : null, wx: icon ? Math.max(70, Math.min(worldSize.w - 70, icon.x + 85)) : null, wy: icon ? Math.max(minFeet(), Math.min(bounds().floorY, icon.y + 92)) : null })
        } catch (err) {
          report('dbg-launch-icons-err', { name, msg: String(err && err.message || err) })
        }
        const id = 'launch-' + Math.round(Math.random() * 1e6)
        if (icon) {
          // 站到图标旁边（贴右沿、脚踩图标格子底），够不着就贴边（图标坐标已是 CSS 像素，格子约 77×96）
          const ix = Math.max(70, Math.min(worldSize.w - 70, icon.x + 85))
          const iy = Math.max(minFeet(), Math.min(bounds().floorY, icon.y + 92))
          const okWalk = pet.walkTo?.(ix, true, id, iy)
          report('dbg-launch-walk', { toIcon: true, ix, iy, ok: okWalk === true, name })
          if (okWalk) {
            launchWalk = { id, name }
            say('好嘞，去开' + name)
            return
          }
        }
        // 图标没找到：走到屏幕下沿（任务栏方向）戳一下
        const me = pet.layout?.()
        const tx = Math.max(60, Math.min(worldSize.w - 60, Math.round((me ? me.x : worldSize.w / 2) + (Math.random() < 0.5 ? -220 : 220))))
        const okFall = pet.walkTo?.(tx, true, id, worldSize.h - 8)
        report('dbg-launch-walk', { toIcon: false, tx, ok: okFall === true, name })
        if (okFall) {
          launchWalk = { id, name }
          say('好嘞，去开' + name)
        } else {
          performTapAndLaunch(name)
        }
      }

      const submitChat = () => {
        const text = String(chatText.value || '').trim()
        // 诊断：确认提交函数被调到、拿到的是什么文本
        report('dbg-chat-submit', { text: text.slice(0, 30), len: text.length })
        if (!text) return
        chatText.value = ''
        // 先拦一道本地指令：打开某软件就不用麻烦 AI 了
        const m = text.match(LAUNCH_RE)
        if (m && m[1]) {
          closeChat()
          launchTheater(m[1].trim())
          return
        }
        // 本地快捷指令：不麻烦 AI，她自己做（和「打开XX」同一层拦截）
        const cmd = text.replace(/\s+/g, '')
        if (/^(?:开启)?安静模式$/.test(cmd)) {
          closeChat()
          if (!offDuty) {
            say('好，那我安静会儿~')
            setOffDuty(true)
          }
          return
        }
        if (/^(?:关闭|取消|解除)安静模式$/.test(cmd)) {
          closeChat()
          if (offDuty) {
            setOffDuty(false)
            say('安静模式关闭，我又活蹦乱跳咯！')
          }
          return
        }
        if (/^(?:开始|启动)?番茄钟$/.test(cmd)) {
          closeChat()
          startPomodoro()
          return
        }
        if (/^(?:结束|停止|取消)番茄钟$/.test(cmd)) {
          closeChat()
          stopPomodoro(true)
          return
        }
        // 插入会话优先：填了 Session ID 就发进那个会话，没填才跟当前会话
        // 只认绑定的会话：填了谁就问谁，绝不另找会话（问题串到别的会话里回答就会被桥接走）；
        // 不填不说话——提醒去设置里填
        const sessionId = String((prefs && prefs.attachSession) || '').trim()
        if (!sessionId) {
          closeChat()
          say('还没绑定会话哦，去设置页填一个 Session ID 吧')
          return
        }
        fetch('/dsh-coo-pet/prompt', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ text, sessionId }),
        }).catch(() => {})
        say('说了：' + text.slice(0, 30))
        startThinking()
        closeChat()
      }

      /* ---------- 建她 ---------- */
      try {
        // 本仓库不随附鲸鱼美术资源（权利说明见 THIRD_PARTY_NOTICES.md）：图没就位时给出引导而不是白屏
        const whaleOk = await fetch(`${ROOT}/whale/model.json`, { method: 'GET' })
          .then((res) => res.ok)
          .catch(() => false)
        if (!whaleOk) {
          const hint = document.createElement('div')
          hint.textContent = '🐳 鲸鱼贴图缺失 —— 插件文件不完整，重新下载完整的插件包后重启 DSH'
          hint.style.cssText =
            'position:fixed;left:50%;top:38%;transform:translateX(-50%);padding:10px 16px;background:rgba(255,255,255,0.95);color:#1d2333;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.22);font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif;white-space:nowrap;'
          document.body.appendChild(hint)
          throw new Error('whale textures missing: plugin package incomplete')
        }
        kit = await import(`${ROOT}/kit/body.js`)
        pack = await import(`${ROOT}/whale/figure.js`)
        const model = await fetch(`${ROOT}/whale/model.json`).then((res) => res.json())

        const host = {
          root: stage,
          bounds,
          emit(kind, detail) {
            // 行走结局：到了就坐下 / 挪图标；被打断就放弃这轮，下次再试
            if (kind === 'arrived' || kind === 'interrupted') {
              const id = detail && detail.walkId
              const sw = seatWalk
              const iw = iconWalk
              const lw = launchWalk
              if (lw && lw.id === id) {
                launchWalk = null
                if (kind === 'arrived') {
                  say('咚——我戳它一下')
                  performTapAndLaunch(lw.name)
                }
                return
              }
              if (sw && sw.id === id) {
                seatWalk = null
                if (kind === 'arrived') sitAt(sw.x, sw.y)
                if (kind === 'arrived' && sw.line && lines.length) chatterSay(sw.line)
              }
              if (iw && iw.id === id) {
                if (kind === 'arrived' && iw.phase === 1) {
                  // 到了图标跟前：举起包裹，抱着走到新位置再放下
                  const dx = Math.random() < 0.5 ? -96 : 96
                  const toX = Math.max(8, Math.min(worldSize.w - 120, iw.icon.x + dx))
                  const toY = Math.max(8, Math.min(window.innerHeight - 120, iw.icon.y + (Math.random() < 0.4 ? 96 : 0)))
                  const id2 = 'icon2-' + Math.round(Math.random() * 1e6)
                  if (pet.walkTo?.(toX, false, id2, worldSize.h - 8)) {
                    iconWalk = { id: id2, icon: iw.icon, phase: 2, toX, toY }
                    carry = { toX, toY }
                    showCarry()
                    say('抱起来咯')
                  } else {
                    iconWalk = null
                  }
                  return
                }
                iconWalk = null
                carry = null
                hideCarry()
                if (kind === 'arrived' && iw.phase === 2) {
                  const fw = iw
                  window.setTimeout(async () => {
