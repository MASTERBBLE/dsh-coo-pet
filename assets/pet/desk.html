          setVoice(false)
        },
        true
      )
      const mouseHot = (button) => {
        const want = parseHot(prefs.hotkey)
        return !!(want && want.mouse === button)
      }
      window.addEventListener(
        'mousedown',
        (event) => {
          if (prefs.hotkeyOn === false) return
          if (!mouseHot(event.button)) return
          event.preventDefault()
          setVoice(true)
        },
        true
      )
      window.addEventListener(
        'mouseup',
        (event) => {
          if (prefs.hotkeyOn === false) return
          if (!mouseHot(event.button)) return
          event.preventDefault()
          setVoice(false)
        },
        true
      )
      window.addEventListener('auxclick', (event) => {
        if (prefs.hotkeyOn !== false && mouseHot(event.button)) event.preventDefault()
      })

      // 键盘组合键交给主进程做系统级注册后回调（窗口是 focusable:false，收不到键盘）
      try {
        desk.hotkey(prefs.hotkey)
      } catch {
        /* ignore */
      }
      try {
        desk.onHot((detail) => {
          if (prefs.hotkeyOn === false) return
          // 键盘：按一次开麦再按一次收工（无状态）；鼠标：按住说、松开收（down/up）
          if (detail && detail.state === 'down') setVoice(true)
          else if (detail && detail.state === 'up') setVoice(false)
          else setVoice(!voiceHeld)
        })
      } catch {
        /* ignore */
      }

      /* ---------- 桌面动作：随便坐 / 拖图标 ---------- */
      let quietSince = Date.now()

      let winCache = { at: 0, data: [] }
      const windowsOf = async () => {
        if (Date.now() - winCache.at < 25000) return winCache.data
        try {
          const res = await desk.windows()
          const data = res && res.ok && Array.isArray(res.data) ? res.data : []
          winCache = { at: Date.now(), data }
          return data
        } catch {
          return []
        }
      }
      let iconCache = { at: 0, data: [] }
      const iconsOf = async () => {
        if (Date.now() - iconCache.at < 60000) return iconCache.data
        try {
          const res = await desk.icons()
          const data = res && res.ok && Array.isArray(res.data) ? res.data : []
          iconCache = { at: Date.now(), data }
          return data
        } catch {
          return []
        }
      }

      const sitAt = (x, feetY) => {
        if (!pet) return
        seat = Math.max(minFeet(), Math.min(worldSize.h - 20, Math.round(feetY)))
        try {
          pet.place?.(Math.round(x), pet.layout?.()?.facing ?? 1, seat)
        } catch {
          /* ignore */
        }
      }
      const standUp = () => {
        if (seat === null) return
        seat = null
        try {
          applyRoam()
        } catch {
          /* ignore */
        }
      }

      // 界面占用中：菜单或输入框开着时，定时器们不该让她走来走去（坐图标/搬图标/坐下都会把人拉走）
      const uiBusy = () => !!menuEl || !!(chatEl && !chatEl.classList.contains('hidden'))

      const trySit = async () => {
        if (!prefs.actSit || offDuty || napping || seat !== null || dragging || busy || stayMode || thinkingNow || voiceHeld || uiBusy() || launchWalk) return
        if (!pet || seatWalk) return
        const mode = pet.layout?.()?.mode ?? 'idle'
        if (!['idle', 'sit', 'sleep', 'look'].includes(mode)) return
        const roll = Math.random()
        let spot = null
        if (roll < 0.5) {
          const icons = await iconsOf()
          if (icons.length) {
            const icon = icons[Math.floor(Math.random() * icons.length)]
            // 坐在图标上：脚踩在图标图案的上沿（格子约 77×96，图案占中上）
            spot = { x: icon.x + 38, y: icon.y + 40, line: '这张好坐' }
          }
        }
        if (!spot) {
          const wins = await windowsOf()
          const live = wins.filter((w) => w.w > 320 && w.y >= minFeet() && w.y < worldSize.h - 120)
          if (!live.length) return
          const target = live[Math.floor(Math.random() * live.length)]
          spot = { x: target.x + 40 + Math.random() * Math.max(1, target.w - 80), y: target.y, line: '边沿挺舒服的' }
        }
        // 不再瞬移：先走到落点，到了再坐；走不了（忙着呢）就这轮放弃
        const id = 'sit-' + Math.round(Math.random() * 1e6)
        if (!pet.walkTo?.(spot.x, false, id, spot.y)) return
        seatWalk = { id, x: spot.x, y: spot.y, line: spot.line }
      }

      // 桌面干净（只剩壁纸）才允许碰图标：force=真时绕过缓存实查一次（动手前的最后一道闸）
      let cleanCache = { at: 0, empty: false }
      const deskClean = async (force) => {
        if (!force && Date.now() - cleanCache.at < 1200) return cleanCache.empty
        try {
          const res = await desk.windows()
          const data = res && res.ok && Array.isArray(res.data) ? res.data : null
          if (!data) return false // 探不到窗口就当她别搬
          cleanCache = { at: Date.now(), empty: data.length === 0 }
          return cleanCache.empty
        } catch {
          return false
        }
      }

      // 抱起某个图标：挑一个不压到别的图标的新位置，抱着走过去放下
      const startCarry = (icon, others) => {
        if (!pet) return false
        // 动手前先存一份全部图标位置——「一键复位」就是回到这份快照
        try { desk.snapshotIcons?.().catch(() => {}) } catch { /* ignore */ }
        // 在全屏找一块「空地」：离所有其他图标至少 110px、离原位置至少 180px（图标格子约 77×96，中心 ≈ +38/+48）
        const centers = (others || []).filter((o) => o.i !== icon.i).map((o) => ({ x: o.x + 38, y: o.y + 48 }))
        const homeX = icon.x + 38
        const homeY = icon.y + 48
        let best = null
        let bestScore = -Infinity
        for (let k = 0; k < 24; k++) {
          const tx = 60 + Math.random() * Math.max(1, worldSize.w - 180)
          const ty = 60 + Math.random() * Math.max(1, window.innerHeight - 200)
          const clear = centers.reduce((m, o) => Math.min(m, Math.hypot(o.x - (tx + 24), o.y - (ty + 30))), Infinity)
          const fromHome = Math.hypot(homeX - (tx + 24), homeY - (ty + 30))
          if (clear >= 110 && fromHome >= 180) {
            best = { x: tx, y: ty }
            break
          }
          const score = Math.min(clear, fromHome)
          if (score > bestScore) {
            bestScore = score
            best = { x: tx, y: ty }
          }
        }
        if (!best) return false
        const id2 = 'icon2-' + Math.round(Math.random() * 1e6)
        // 抱着走到空地正上方，走到哪放到哪（脚下就是落点）
        if (!pet.walkTo?.(best.x, false, id2, best.y)) return false
        iconWalk = { id: id2, icon, phase: 2, toX: best.x, toY: best.y }
        carry = { toX: best.x, toY: best.y }
        showCarry()
        say('抱起来咯')
        return true
      }

      // 搬运间隔：两次搬图标之间至少隔这么久（设置页可调；0 = 不限制）
      let lastCarryAt = 0
      const carryEveryMs = () => {
        const n = Math.max(0, Math.round(Number(prefs.carryEvery) || 0))
        return n > 0 ? n * (prefs.carryUnit === 'sec' ? 1000 : 60000) : 0
      }

      // 巡查：桌面干净时，她走着走着撞到图标，就顺手抱走
      window.setInterval(async () => {
        // 搬运途中冒出窗口：立刻放手（真图标要走到落点才真动，放手=图标原地不动）
        if (iconWalk || carry) {
          if (!(await deskClean(true))) {
            iconWalk = null
            carry = null
            hideCarry()
            report('dbg-carry-abort', { why: 'windows-open' })
          }
          return
        }
        if (!prefs.actIcons || offDuty || napping || prefs.display !== 'desktop' || stayMode || thinkingNow || voiceHeld || uiBusy()) return
        // 正在去开软件的路上不搬图标：要开的就是那个，别把它抱走、也别打断启动行走
        if (launchWalk) return
        // DSH 在跑任务（或有近期活动）时不搬图标：别在她干活时捣乱
        if (busy || Date.now() - lastActive < 30000) return
        // 搬运间隔没到就不搬
        if (Date.now() - lastCarryAt < carryEveryMs()) return
        if (!pet || dragging || busy || seat !== null || iconWalk || carry) return
        const mode = pet.layout?.()?.mode
        if (mode !== 'walk' && mode !== 'run') return
        if (!(await deskClean())) return
        const icons = await iconsOf()
        if (!icons.length) return
        const me = pet.layout?.()
        if (!me) return
        const near = icons.find((ic) => Math.abs(me.x - (ic.x + 38)) < 62 && Math.abs((me.y || 0) - (ic.y + 48)) < 80)
        if (!near) return
        // 临动手前再实查一次窗口（不信缓存）：有窗口开着就绝不抱
        if (!(await deskClean(true))) {
          report('dbg-carry-skip', { why: 'windows-before-grab' })
          return
        }
        say('这个图标挡路了')
        if (startCarry(near, icons)) lastCarryAt = Date.now()
      }, 700)

      // 搬运牌子：一只举在头顶的小包裹（画在宠物 SVG 上层，跟着她走，走路时一颠一颠）
      const showCarry = () => {
        try {
          const svg = stage.querySelector('svg.kit')
          if (!svg) return
          if (!carryG) {
            carryG = document.createElementNS('http://www.w3.org/2000/svg', 'g')
            carryG.style.pointerEvents = 'none'
            svg.appendChild(carryG)
          }
          carryG.innerHTML =
            '<rect x="-30" y="-28" width="60" height="46" rx="7" fill="#f7d9a0" stroke="#b8863b" stroke-width="3"/>' +
            '<line x1="-30" y1="-7" x2="30" y2="-7" stroke="#b8863b" stroke-width="3"/>' +
            '<line x1="0" y1="-28" x2="0" y2="-7" stroke="#b8863b" stroke-width="3"/>'
          carryG.style.display = ''
        } catch {
          /* ignore */
        }
      }
      const hideCarry = () => {
        if (carryG) carryG.style.display = 'none'
      }
      const updateCarry = () => {
        if (!carry || !carryG || carryG.style.display === 'none' || !pet) return
        try {
          const b = pet.layout?.()
          if (!b || !b.box) return
          const bob = Math.round(Math.sin(performance.now() / 180) * 3)
          const cx = b.box.x + b.box.w / 2
          const cy = b.box.y - 6
          carryG.setAttribute('transform', 'translate(' + Math.round(cx) + ',' + Math.round(cy + bob) + ')')
        } catch {
          /* ignore */
        }
      }

      window.setInterval(() => {
        if (busy) {
          quietSince = Date.now()
          return
        }
        if (Date.now() - quietSince < 4000) return
        trySit()
        // 坐久了就自己下来
        if (seat !== null && Math.random() < 0.35) {
          window.setTimeout(standUp, 6000 + Math.random() * 8000)
        }
      }, 9000)

      /* ---------- 每帧推进 ---------- */
      let last = 0
      let lastStep = 0
      let fpsFrames = 0
      let fpsAt = 0
      window.__cooFps = 0
      let frameNo = 0
      let cloneLast = 0 // 分身自己的时钟：不跟本体降帧（本体睡着/闲着降帧时分身照样顺滑）
      const step = (time) => {
        // 全真分身：每只都是完整本体实例，自己 step（AI/物理/渲染全在引擎里）
        try {
          const cdt = cloneLast === 0 ? 0.016 : Math.min(0.05, (time - cloneLast) / 1000)
          cloneLast = time
          for (const c of clones) c.bp.step(cdt)
        } catch {
          /* 安静 */
        }
        // rAF 与兜底定时器共用，限到约 30fps，绝不自己再排 rAF（会指数爆炸把电脑卡死）
        // 按状态自适应帧率：睡觉 6fps、闲着 12fps、走动/拖拽 20fps
        const modeNow = pet?.layout?.()?.mode || 'idle'
        // 走动时跟着 rAF 走（60fps），站定才降帧；限帧会弄出 30/60 交替的节奏抖动
        // 除「真站定」和「睡着」之外一律跟着刷新率走：只有这两档才降帧，其余动作都别限
        const moving = !(modeNow === 'idle' || modeNow === 'sleep' || modeNow === 'sit')
        const off = String((prefs && prefs.actOff) || '')
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean)
        if (
          off.length > 0 &&
          off.includes(modeNow) &&
          modeNow !== 'walk' &&
          modeNow !== 'run' &&
          modeNow !== 'air' &&
          modeNow !== 'drag' &&
          modeNow !== 'land'
        ) {
          try {
            pet.do('idle')
          } catch {
            /* ignore */
          }
        }
        const minGap = moving ? 31 : modeNow === 'sleep' ? 400 : modeNow === 'sit' ? 100 : 120
        if (time - lastStep < minGap) return
        // 真正画一帧才计数：给探针用，也方便以后调帧率
        fpsFrames += 1
        if (time - fpsAt >= 1000) {
          window.__cooFps = Math.round((fpsFrames * 1000) / (time - fpsAt))
          fpsFrames = 0
          fpsAt = time
        }
        lastStep = time
        const dt = last === 0 ? 0.016 : Math.min(0.05, ( time - last ) / 1000)
        last = time
        if (!pet) return
        const speed = Number(prefs.speed) > 0 ? Number(prefs.speed) : 1
        try {
          pet.step(dt * speed, true)
        } catch {
          /* 安静 */
        }
        try {
          updateCarry()
        } catch {
          /* 安静 */
        }
        try {
          frameNo += 1
          if (frameNo % 3 !== 0) return
          const box = pet.layout?.()
          if (box) {
            const hits = Array.isArray(box.hit) ? box.hit : []
            if (hits.length) {
              let x1 = Infinity
              let y1 = Infinity
              let x2 = -Infinity
              let y2 = -Infinity
              for (const circle of hits) {
                x1 = Math.min(x1, circle.x - circle.r)
                y1 = Math.min(y1, circle.y - circle.r)
                x2 = Math.max(x2, circle.x + circle.r)
                y2 = Math.max(y2, circle.y + circle.r)
              }
              hit = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 }
            } else if (box.box) {
              hit = { x: box.box.x, y: box.box.y, w: box.box.w, h: box.box.h }
            }
            bubbleAnchor = {
              x: Math.min(Math.max(140, hit.x + hit.w / 2), worldSize.w - 140),
              y: Math.max(70, hit.y - 6),
            }
            placeBubble()
            publishBox(false)
            publishAnchor(box.box || hit)
          }
        } catch {
          /* ignore */
        }
      }
      const loop = (time) => {
        step(time)
        window.requestAnimationFrame(loop)
      }
      window.requestAnimationFrame(loop)
      // 被别的全屏窗口盖住时 rAF 会被节流，定时器只做兜底，平时什么都不做
      window.setInterval(() => {
        if (performance.now() - lastStep > 220) step(performance.now())
      }, 120)

      /* ---------- 碎碎念：气泡 + 朗读，间隔按设置来 ---------- */
      let idleTimer = 0
      const idleTick = () => {
        try {
          if (pet && !dragging && !offDuty && !napping && prefs.idleBubble !== false && prefs.greet !== false && lines.length) {
            say(lines[Math.floor(Math.random() * lines.length)])
          }
        } catch {
          /* ignore */
        }
        idleTimer = window.setTimeout(idleTick, idleMs())
      }
      idleTimer = window.setTimeout(idleTick, idleMs())

      /* ---------- 作息感：深夜犯困去睡觉，清早醒来问早安 ---------- */
      let routinePhase = 'day'
      {
        const h0 = new Date().getHours()
        routinePhase = (h0 >= 23 || h0 < 5) ? 'night' : (h0 < 9) ? 'morning' : 'day'
        // 开机就在深夜：她已经在睡（不喊晚安，别一上来就出声）
        if (routinePhase === 'night' && pet) { try { pet?.act?.('sleep') } catch { /* ignore */ } }
      }
      window.setInterval(() => {
        try {
          // 作息的睡觉不受安静模式限制（睡觉本身就是安静的）；但深夜标记阶段里不重复去睡
          if (!pet || dragging) return
          const h = new Date().getHours()
          if ((h >= 23 || h < 5) && routinePhase !== 'night' && !stayMode) {
            routinePhase = 'night'
            chatterSay('好困了…我去睡觉啦，晚安~')
            try { pet?.act?.('sleep') } catch { /* ignore */ }
          } else if (h >= 5 && h < 9 && routinePhase === 'night') {
            routinePhase = 'morning'
            try { pet?.act?.('wake') } catch { /* ignore */ }
            chatterSay('早呀！新的一天开始咯~')
          } else if (h >= 9 && h < 23 && routinePhase !== 'day') {
            routinePhase = 'day'
          }
        } catch { /* ignore */ }
      }, 60000)

      /* ---------- 被冷落的小情绪：5 分钟没人理她蔫了，一互动就缓过来 ---------- */
      const GLOOM_MS = 5 * 60 * 1000
      let lastTouch = Date.now()
      let gloomSaidAt = 0
      const noteTouch = () => {
        lastTouch = Date.now()
        // 打盹中被打扰：立刻醒来
        wakeNap()
        // 刚蔫过不久就互动：立刻开心起来
        if (Date.now() - gloomSaidAt < 90000 && !offDuty) {
          try { pet?.setExpr?.('happy') } catch { /* ignore */ }
        }
      }
      for (const ev of ['pointerdown', 'click', 'keydown']) {
        window.addEventListener(ev, noteTouch, { passive: true })
      }
      window.setInterval(() => {
        try {
          if (offDuty || !pet || dragging || uiBusy() || busy) return
          if (stayMode) return
          if (napping || Date.now() - lastTouch < GLOOM_MS) return
          if (Date.now() - gloomSaidAt < GLOOM_MS) return
          gloomSaidAt = Date.now()
            chatterSay(['咦，大家都去哪儿了呀…', '一个人待着有点冷清呢…', '喂——还在吗？（小声戳戳）'][Math.floor(Math.random() * 3)])
          try { pet?.setExpr?.(['cry', 'worried', 'pout'][Math.floor(Math.random() * 3)]) } catch { /* ignore */ }
        } catch { /* ignore */ }
      }, 60000)

      /* ---------- 平时的小盹儿：白天闲着没事打个盹（作息感保留），一戳/一敲键盘就醒 ---------- */
      const wakeNap = () => {
        if (!napping) return
        napping = false
        window.clearTimeout(napTimer)
        napTimer = 0
        try { pet?.do?.('stand') } catch { /* 引擎被戳醒过就不必再叫 */ }
        applyRoam()
      }
      const startNap = () => {
        if (napping || !pet || dragging || busy || thinkingNow || voiceHeld || uiBusy() || launchWalk || seat !== null) return
        napping = true
        applyRoam()
        try { pet?.do?.('sleep') } catch { /* ignore */ }
        // 打盹 18~34 秒自己醒：伸个懒腰犯个困，接着该干嘛干嘛
        napTimer = window.setTimeout(() => {
          napTimer = 0
          napping = false
          try { pet?.do?.('stand') } catch { /* ignore */ }
          try { pet?.setExpr?.('sleepy') } catch { /* ignore */ }
          applyRoam()
        }, R(18, 34) * 1000)
      }
      window.setInterval(() => {
        try {
          if (napping || !pet || dragging || busy || thinkingNow || uiBusy() || launchWalk || seat !== null) return
          if (routinePhase === 'night') return // 夜里有正经觉，白天才打小盹
          if (Date.now() - lastTouch < 3 * 60 * 1000) return // 刚互动过不睡
          if (Math.random() > 0.12) return // 闲着每分钟约一成概率犯困
          startNap()
        } catch { /* ignore */ }
      }, 60000)

      /* ---------- 设置页「试一下」：把动作广播到这只 ---------- */
      let actSeq = 0
      window.setInterval(async () => {
        try {
          const body = await fetch(`/dsh-coo-pet/act?since=${actSeq}`, { credentials: 'same-origin' }).then((res) => res.json())
          const seq = Number(body && body.seq) || 0
          if (seq > actSeq) {
            actSeq = seq
            const act = body && body.act && body.act.act
            try { report('act-recv', { seq, act: act || String(body && body.act && body.act.act) }) } catch { /* ignore */ }
            if (act === 'reset') {
              restoreIconsAll()
            } else if (act === 'resetAll') {
              restoreIconsAllEvery()
            } else if (act === 'launch') {
              // 语音说「打开XX」走这里：和打字同一个开软件流程
              const nm = String((body.act && body.act.name) || '').trim()
              if (nm) launchTheater(nm)
            } else if (act === 'spawnClones') {
              // 远程召唤分身（设置页/调试用）
              spawnClones(Number((body.act && body.act.name) || '') || 10)
            } else if (act === 'clearClones') {
              dismissAllClones()
            } else if (act === 'cloneFreeze') {
              // 调试：让全部分身立定不动（再发一次解除）——等同「分身行为›立定不动」
              cloneFrozen = !cloneFrozen
              cloneMode = cloneFrozen ? 'frozen' : 'free'
              applyCloneMode()
            } else if (act && pet && typeof pet.do === 'function') {
              pet.do(act)
              chime(act === 'dance' ? 'dance' : act === 'spin' ? 'spin' : 'select')
            }
          }
        } catch {
          /* 断线先这样 */
        }
      }, 700)

      /* ---------- 插入会话的回答：填了 Session ID 后，回答回流到气泡并朗读 ---------- */
      let answerSeq = 0
      window.setInterval(async () => {
        if (!String((prefs && prefs.attachSession) || '').trim()) return
        try {
          const body = await fetch(`/dsh-coo-pet/answer?since=${answerSeq}`, { credentials: 'same-origin' }).then((res) => res.json())
          const seq = Number(body && body.seq) || 0
          if (seq > answerSeq) {
            answerSeq = seq
            const text = body && body.answer && body.answer.text
            if (text) answerSay(String(text).slice(0, 600))
          }
        } catch {
          /* 断线先这样 */
        }
      }, 900)

      /* ---------- 设置页「试听 / 测试」：把一句话喊出来 ---------- */
      let saySeq = 0
      window.setInterval(async () => {
        try {
          const body = await fetch(`/dsh-coo-pet/say?since=${saySeq}`, { credentials: 'same-origin' }).then((res) => res.json())
          const seq = Number(body && body.seq) || 0
          if (seq <= saySeq) return
          saySeq = seq
          const item = body && body.say
          if (!item || !item.text) return
          say(item.text)
        } catch {
          /* 断线先这样 */
        }
      }, 700)

      /* ---------- 语音识别文字：实时填进她的输入框，最终一句也只填不发送 ---------- */
      let vtSeq = 0
      window.setInterval(async () => {
        try {
          const body = await fetch(`/dsh-coo-pet/voicetext?since=${vtSeq}`, { credentials: 'same-origin' }).then((res) => res.json())
          const seq = Number(body && body.seq) || 0
          if (seq <= vtSeq) return
          vtSeq = seq
          const item = body && body.text
          if (!item) return
          const text = String(item.text || '')
          if (item.final) {
            // 最终结果只填框，**不自动发送**（master 自己回车或点发送）
            if (text.trim()) {
              if (chatEl.classList.contains('hidden')) {
                openChat(false)
                voiceChat = false
              }
              chatText.value = text
            } else {
              closeChat()
            }
          } else {
            // 中间结果：输入框没开就开（不抢焦点），字边听边往上打
            if (chatEl.classList.contains('hidden')) openChat(false)
            chatText.value = text
          }
        } catch {
          /* 断线先这样 */
        }
      }, 350)

      /* 设置变化：换配色/衣服/大小就重载，其余即时生效 */
      let watch = JSON.stringify({ look: prefs.look, outfit: prefs.outfit })
      let watchSize = String(prefs.size ?? '')
      let attachLostFor = ''
      window.setInterval(async () => {
        try {
          const body = await fetch('/dsh-coo-pet/prefs', { credentials: 'same-origin' }).then((res) => res.json())
          const next = body && body.config
          if (!next) return
          const hotChanged = next.hotkey !== prefs.hotkey
          const wanderChanged = next.wander !== prefs.wander
          const idleKeyBefore = JSON.stringify([prefs.idleLines, prefs.petName])
          prefs = { ...prefs, ...next }
          // 碎碎念内容或姓名变了：词表跟着重算（之前只在启动时算一次，改配置她也不换词）
          if (idleKeyBefore !== JSON.stringify([prefs.idleLines, prefs.petName])) {
            lines = splitLines(prefs.idleLines)
          }
          if (hotChanged) {
            try {
              desk.hotkey(prefs.hotkey)
            } catch {
              /* ignore */
            }
          }
          // 溜达开关变了立即应用；值没变不动（避免干扰气泡/思考时的临时 roam 状态）
          if (wanderChanged) applyRoam()
          // busy / lastActiveAt 在响应顶层（不在 config 里），从 body 读——之前误从 config 读，
          // busy 永远是 false，「干活别搬图标 / 别乱走」的拦截从来没生效过
          lastActive = Number(body.lastActiveAt || 0)
          const nowBusy = body.busy === true
          if (nowBusy !== busy) {
            busy = nowBusy
            if (busy) {
              // DSH 开始干活（思考/执行工具）：原地站住别溜达，手里的搬运就地放下
              thinkingNow = true
              try { pet?.set?.({ thinking: true, roam: 'off' }) } catch { /* ignore */ }
              if (!launchWalk && !seatWalk) { try { pet?.stopWalk?.() } catch { /* ignore */ } }
              if (iconWalk || carry) { iconWalk = null; carry = null; hideCarry() }
            } else {
              // 干完活了，恢复平时的活动状态（回答气泡还挂着就先别动，等气泡收掉再放行）
              thinkingNow = false
              try { pet?.set?.({ thinking: false }) } catch { /* ignore */ }
              window.clearTimeout(thinkTimer)
              if (bubbleEl && !bubbleEl.classList.contains('on')) applyRoam()
            }
          }
          // 插入会话状态：确认跟丢了只喊一次（同一个会话 ID 不重复喊，避免状态抖动刷屏）
          const attach = body.attach
          if (attach && attach.id) {
            if (attach.ok === false && attachLostFor !== attach.id) {
              attachLostFor = attach.id
              say('插入的会话好像跟丢了，去设置里看看 Session ID 吧')
            }
          } else {
            attachLostFor = ''
          }
          // 体型变了才整页重载；形象 / 衣服变了走原地无缝换肤（不闪不跳，动作不打断）
          const now = JSON.stringify({ look: prefs.look, outfit: prefs.outfit })
          if (now !== watch) {
            watch = now
            try {
              pet?.setScheme?.(`${prefs.look || 'deepseek'}-${prefs.outfit || 'maid'}`, { fade: 0.6 })
            } catch {
              /* ignore */
            }
          }
          const sz = String(prefs.size ?? '')
          if (sz !== watchSize) {
            watchSize = sz
            window.location.reload()
            return
          }
          if (prefs.display === 'none') desk.close()
          stage.style.opacity = String(prefs.opacity ?? 1)
          lines = splitLines(prefs.idleLines)
        } catch {
          /* 断线先这样 */
        }
      }, 3000)
    </script>
  </body>
</html>
